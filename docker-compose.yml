services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cne_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cne_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/cne_db
      JWT_SECRET_KEY: cambia-esta-clave-en-produccion
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      FLASK_DEBUG: "true"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "flask --app app init-db && python app.py"

volumes:
  postgres_data:
